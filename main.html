<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная — R2GO</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #F5F5F5;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <div class="app-container flex flex-col min-h-screen relative overflow-x-hidden">
    
    <!-- ШАПКА СТРАНИЦЫ (HEADER) -->
    <header class="border-b border-[#F1F1F2] bg-white sticky top-0 z-10">
      <div class="max-w-[480px] mx-auto flex items-center justify-between gap-2 px-4 py-3">
        <h1 class="flex-1 font-extrabold text-2xl tracking-tight text-[#111111]">Главная</h1>
        
        <!-- Кнопка «Уведомления» -->
        <button type="button" aria-label="Новости" class="relative grid h-10 w-10 shrink-0 place-items-center rounded-full border border-[#E2E5E9] bg-white text-[#111111] hover:bg-[#F8F9FA] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
        </button>

        <!-- Кнопка «Мои настройки» (Аватар) -->
        <button type="button" aria-label="Мои настройки" class="shrink-0 rounded-full">
          <span aria-hidden="true" class="inline-grid shrink-0 place-items-center rounded-full border border-[#E2E5E9] bg-[#F1F2F4] font-bold h-10 w-10 text-sm text-[#111111]">
            КИ
          </span>
        </button>
      </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-[480px] mx-auto w-full flex-col gap-3.5 px-3.5 pb-[30px] pt-4 flex-1 flex">
      
      <!-- СЕКЦИЯ: ПОСЛЕДНЕЕ ИСПОЛЬЗУЕМОЕ -->
      <div id="recent-section">
        <div class="mx-0.5 mb-2.5 mt-0.5 flex items-center justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-[0.04em] text-[#A1A1AA]">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock text-[#E5297D]">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Последнее используемое</span>
          </div>
          
          <button type="button" title="Скрыть" onclick="toggleRecent()" class="p-0.5 text-[#A1A1AA] hover:text-black transition-colors">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
              <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div id="recent-items" class="flex gap-3.5 overflow-x-auto px-0.5 py-1.5 transition-all">
          <button type="button" onclick="openModule('FBS WB 2.0')" class="flex w-[80px] flex-none flex-col items-center gap-[7px]">
            <div class="relative">
              <div class="flex flex-col items-center justify-center leading-none" style="width: 68px; height: 68px; border-radius: 19px; background: rgb(123, 45, 142);">
                <span class="font-extrabold tracking-[-0.02em] text-white text-[20px]">WB</span>
                <span class="mt-px font-bold text-white text-[13px]">FBS 2.0</span>
              </div>
            </div>
            <span class="text-center text-[11px] font-semibold leading-[1.2] text-[#3F3F46]">FBS WB 2.0</span>
          </button>
        </div>
      </div>

      <!-- КАРТОЧКИ РАЗДЕЛОВ -->
      <div class="flex flex-col gap-3 mt-3">
        
        <!-- 1. ОТПРАВКИ -->
        <div class="overflow-hidden rounded-2xl border border-[#E7E7EA] bg-white transition-all">
          <button type="button" onclick="toggleAccordion('shipments-body', 'shipments-arrow')" class="flex w-full items-center gap-3 px-3.5 py-3 text-left">
            <div class="flex h-[34px] w-[34px] flex-none items-center justify-center rounded-[10px] bg-[#F1EEF2]">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-truck text-[#52525B]">
                <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
                <path d="M15 18H9"></path>
                <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
                <circle cx="17" cy="18" r="2"></circle>
                <circle cx="7" cy="18" r="2"></circle>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[15.5px] font-bold text-[#18181B]">Отправки</div>
              <div class="mt-px text-xs text-[#A1A1AA]">2 страницы</div>
            </div>
            <svg id="shipments-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right flex-none text-[#C4C4C8] transition-transform duration-180">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <div id="shipments-body" class="hidden border-t border-[#F1F1F2] px-3.5 pb-5 pt-4">
            <div class="grid grid-cols-3 gap-x-2 gap-y-5 pt-1.5">
              <button type="button" onclick="openModule('FBS WB 2.0')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none" style="width: 72px; height: 72px; border-radius: 20px; background: rgb(123, 45, 142);">
                  <span class="font-extrabold tracking-[-0.02em] text-white text-[22px]">WB</span>
                  <span class="mt-px font-bold text-white text-[14px]">FBS 2.0</span>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">FBS WB 2.0</span>
              </button>
              <button type="button" onclick="openModule('FBS Ozon 2.0')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none" style="width: 72px; height: 72px; border-radius: 20px; background: rgb(11, 87, 208);">
                  <span class="font-extrabold tracking-[-0.02em] text-white text-[22px]">OZ</span>
                  <span class="mt-px font-bold text-white text-[14px]">FBS 2.0</span>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">FBS Ozon 2.0</span>
              </button>
            </div>
          </div>
        </div>


        
        <!-- 6. СБОРКА -->
        <div class="overflow-hidden rounded-2xl border border-[#E7E7EA] bg-white transition-all">
        <!-- Шапка карточки "Сборка" -->
        <button type="button" onclick="toggleAccordion('assembly-body', 'assembly-arrow')" class="flex w-full items-center gap-3 px-3.5 py-3 text-left">
            <div class="flex h-[34px] w-[34px] flex-none items-center justify-center rounded-[10px] bg-[#F1EEF2]">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-box text-[#52525B]">
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 8Z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            </div>
            <div class="min-w-0 flex-1">
            <div class="text-[15.5px] font-bold text-[#18181B]">Сборка</div>
            <div class="mt-px text-xs text-[#A1A1AA]">1 страница</div>
            </div>
            <svg id="assembly-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right flex-none text-[#C4C4C8] transition-transform duration-180 rotate-90">
            <path d="m9 18 6-6-6-6"></path>
            </svg>
        </button>

        <!-- Содержимое карточки "Сборка" с кнопкой "Резерв FBO" -->
        <div id="assembly-body" class="border-t border-[#F1F1F2] px-3.5 pb-5 pt-4">
            <div class="grid grid-cols-3 gap-x-2 gap-y-5 pt-1.5">
            <!-- Нажатие ИМЕННО на эту кнопку открывает страницу резерва -->
            <button type="button" onclick="window.location.href='rezervFBO.html'" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-pink-600 bg-pink-50" style="width: 72px; height: 72px; border-radius: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 8Z"/>
                </svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Резерв FBO</span>
            </button>
            <!-- 2. Кнопка: Сборка резерва FBO -->
            <button type="button" onclick="window.location.href='assemblyFBO.html'" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/><path d="m9 14 2 2 4-4"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Сборка резерва FBO</span>
            </button>
            <button type="button" onclick="window.location.href='workSchedule.html'" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">График работы</span>
            </button>
            <button type="button" onclick="window.location.href='workerStatistics.html'" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-pink-600 bg-pink-50" style="width: 72px; height: 72px; border-radius: 20px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Моя статистика</span>
            </button>
            </div>
        </div>
        </div>

        <!-- 2. ПРОИЗВОДСТВО -->
        <div class="overflow-hidden rounded-2xl border border-[#E7E7EA] bg-white transition-all">
          <button type="button" onclick="toggleAccordion('prod-body', 'prod-arrow')" class="flex w-full items-center gap-3 px-3.5 py-3 text-left">
            <div class="flex h-[34px] w-[34px] flex-none items-center justify-center rounded-[10px] bg-[#F1EEF2]">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-factory text-[#52525B]">
                <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path>
                <path d="M17 18h1"></path>
                <path d="M12 18h1"></path>
                <path d="M7 18h1"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[15.5px] font-bold text-[#18181B]">Производство</div>
              <div class="mt-px text-xs text-[#A1A1AA]">5 страниц</div>
            </div>
            <svg id="prod-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right flex-none text-[#C4C4C8] transition-transform duration-180 rotate-90">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <div id="prod-body" class="border-t border-[#F1F1F2] px-3.5 pb-5 pt-4">
            <div class="grid grid-cols-3 gap-x-2 gap-y-5 pt-1.5">
              <button type="button" onclick="openModule('Другие задачи')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Другие задачи</span>
              </button>
              <button type="button" onclick="openModule('Новый материал')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.587 1.414l-4.826 4.825A2 2 0 0 0 4 17.5v2.001a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2a2 2 0 0 0-.587-1.414l-4.826-4.825A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Новый материал</span>
              </button>
              <button type="button" onclick="openModule('Задачи сотрудников')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/><path d="m9 14 2 2 4-4"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Задачи сотрудников</span>
              </button>
              <button type="button" onclick="openModule('Статистика сотрудников')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Статистика сотрудников</span>
              </button>
              <button type="button" onclick="openModule('Моя статистика')" class="flex flex-col items-center gap-[7px]">
                <div class="flex flex-col items-center justify-center leading-none text-purple-600 bg-purple-50" style="width: 72px; height: 72px; border-radius: 20px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </div>
                <span class="max-w-[88px] text-center text-[11.5px] font-semibold leading-[1.2] text-[#3F3F46]">Моя статистика</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 3. ИНСТРУМЕНТЫ -->
        <div class="overflow-hidden rounded-2xl border border-[#E7E7EA] bg-white transition-all">
          <button type="button" onclick="toggleAccordion('tools-body', 'tools-arrow')" class="flex w-full items-center gap-3 px-3.5 py-3 text-left">
            <div class="flex h-[34px] w-[34px] flex-none items-center justify-center rounded-[10px] bg-[#F1EEF2]">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wrench text-[#52525B]">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[15.5px] font-bold text-[#18181B]">Инструменты</div>
              <div class="mt-px text-xs text-[#A1A1AA]">5 страниц</div>
            </div>
            <svg id="tools-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right flex-none text-[#C4C4C8] transition-transform duration-180 rotate-90">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <div id="tools-body" class="border-t border-[#F1F1F2] px-3.5 pb-5 pt-4">
            <div class="grid grid-cols-3 gap-x-2 gap-y-5 pt-1.5">
              <button type="button" onclick="openModule('Создать документ')" class="flex flex-col items-center gap-[7px]">

  <script>
    function toggleAccordion(bodyId, arrowId) {
      const body = document.getElementById(bodyId);
      const arrow = document.getElementById(arrowId);
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        arrow.classList.add('rotate-90');
      } else {
        body.classList.add('hidden');
        arrow.classList.remove('rotate-90');
      }
    }
    function toggleRecent() {
      const recentItems = document.getElementById('recent-items');
      const eyeIcon = document.getElementById('eye-icon');
      if (recentItems.classList.contains('hidden')) {
        recentItems.classList.remove('hidden');
        eyeIcon.style.opacity = '1';
      } else {
        recentItems.classList.add('hidden');
        eyeIcon.style.opacity = '0.4';
      }
    }
    function openModule(name) {
      alert('Переход в раздел: ' + name);
    }
  </script>
