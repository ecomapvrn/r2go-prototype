<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резерв FBO — Руководитель</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pageBg: '#F5F5F5',
                        coolGray: '#F2F6F9',
                        cardBg: '#FFFFFF',
                        mainText: '#111111',
                        secondaryText: '#858585',
                        cardBorder: '#E4E6E8',
                        pinkBtn: '#E23E9F',
                        purpleAccent: '#7C3AED',
                        blueAccent: '#2563EB',
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F5F5F5;
            color: #111111;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F5F5F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #E4E6E8;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-pageBg text-mainText min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div id="root" class="w-full max-w-md bg-pageBg min-h-screen sm:min-h-[850px] sm:rounded-3xl sm:shadow-2xl sm:border border-cardBorder overflow-hidden flex flex-col relative"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const initialItems = [
            { id: 1, name: "R2GO_VF_AS", quantity: 150 },
            { id: 2, name: "R2GO_VF_AS_EF", quantity: 85 },
            { id: 3, name: "R2GO_VF_AS_EF_MS", quantity: 210 },
            { id: 4, name: "R2GO_VF_M_AF", quantity: 64 },
            { id: 5, name: "R2GO_VF_M_EF", quantity: 120 },
            { id: 6, name: "R2GO_VF_MIX_2.1", quantity: 300 },
            { id: 7, name: "R2GO_VF_MIX_2.2", quantity: 175 },
            { id: 8, name: "R2GO_VF_MIX_2.3", quantity: 90 },
            { id: 9, name: "R2GO_VF_MIX_2.4", quantity: 240 },
            { id: 10, name: "R2GO_VF_MIX_2.5", quantity: 110 },
            { id: 11, name: "R2GO_VF_MIX_2.6", quantity: 50 },
        ];

        function App() {
            const [items, setItems] = useState(initialItems);
            const [selectedIds, setSelectedIds] = useState([]);
            const [searchQuery, setSearchQuery] = useState("");
            const [toast, setToast] = useState(null);

            // Modals state
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [newName, setNewName] = useState("");
            const [newQuantity, setNewQuantity] = useState("");

            // Modal: Прибавить к конкретной позиции
            const [addMoreModalItem, setAddMoreModalItem] = useState(null);
            const [addMoreAmount, setAddMoreAmount] = useState(1);

            // Modal: Вычесть из конкретной позиции
            const [subtractModalItem, setSubtractModalItem] = useState(null);
            const [subtractAmount, setSubtractAmount] = useState(1);

            // Modal: Передать в FBO с выбором количества
            const [transferModalItem, setTransferModalItem] = useState(null);
            const [transferAmount, setTransferAmount] = useState(1);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const filteredItems = useMemo(() => {
                return items.filter(item => 
                    item.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [items, searchQuery]);

            const toggleSelectAll = () => {
                if (selectedIds.length === filteredItems.length) {
                    setSelectedIds([]);
                } else {
                    setSelectedIds(filteredItems.map(i => i.id));
                }
            };

            const toggleSelectOne = (id) => {
                if (selectedIds.includes(id)) {
                    setSelectedIds(selectedIds.filter(i => i !== id));
                } else {
                    setSelectedIds([...selectedIds, id]);
                }
            };

            const handleAddPosition = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const qty = parseInt(newQuantity) || 0;
                const newItem = {
                    id: Date.now(),
                    name: newName.trim(),
                    quantity: qty
                };
                setItems([newItem, ...items]);
                setNewName("");
                setNewQuantity("");
                setIsAddModalOpen(false);
                showToast(`Позиция "${newItem.name}" добавлена в резерв`);
            };

            const handleAddMoreSubmit = (e) => {
                e.preventDefault();
                if (!addMoreModalItem) return;
                const amount = parseInt(addMoreAmount) || 0;
                if (amount <= 0) return;

                setItems(items.map(item => {
                    if (item.id === addMoreModalItem.id) {
                        return { ...item, quantity: item.quantity + amount };
                    }
                    return item;
                }));

                showToast(`Добавлено ${amount} шт. к "${addMoreModalItem.name}"`);
                setAddMoreModalItem(null);
                setAddMoreAmount(1);
            };

            const handleSubtractSubmit = (e) => {
                e.preventDefault();
                if (!subtractModalItem) return;
                const amount = parseInt(subtractAmount) || 0;
                if (amount <= 0) return;

                setItems(items.map(item => {
                    if (item.id === subtractModalItem.id) {
                        const updatedQty = Math.max(0, item.quantity - amount);
                        return { ...item, quantity: updatedQty };
                    }
                    return item;
                }));

                showToast(`Списано ${amount} шт. из "${subtractModalItem.name}"`);
                setSubtractModalItem(null);
                setSubtractAmount(1);
            };

            // Массовая передача полностью выбранных позиций
            const transferSelectedToFbo = (idsToTransfer) => {
                if (idsToTransfer.length === 0) return;
                const transferredNames = items
                    .filter(i => idsToTransfer.includes(i.id))
                    .map(i => i.name);
                
                setItems(items.filter(i => !idsToTransfer.includes(i.id)));
                setSelectedIds(selectedIds.filter(id => !idsToTransfer.includes(id)));
                showToast(`Успешно передано в FBO (${transferredNames.length} поз.)`);
            };

            // Передача указанного количества конкретной позиции в FBO
            const handleSingleTransferSubmit = (e) => {
                e.preventDefault();
                if (!transferModalItem) return;
                const amount = parseInt(transferAmount) || 0;
                if (amount <= 0) return;

                setItems(items.map(item => {
                    if (item.id === transferModalItem.id) {
                        const updatedQty = Math.max(0, item.quantity - amount);
                        return { ...item, quantity: updatedQty };
                    }
                    return item;
                }).filter(item => item.quantity > 0)); // Удаляем позицию, если остаток 0

                showToast(`Передано ${amount} шт. "${transferModalItem.name}" в FBO`);
                setTransferModalItem(null);
                setTransferAmount(1);
            };

            const openTransferModal = (item) => {
                setTransferModalItem(item);
                setTransferAmount(item.quantity); // По умолчанию подставляем весь остаток
            };

            return (
                <div className="flex flex-col h-full bg-pageBg flex-1">
                    {/* Header */}
                    <header className="bg-white/90 backdrop-blur-md sticky top-0 z-20 px-4 py-3.5 border-b border-cardBorder flex items-center justify-between">
    <div className="flex items-center space-x-3">
        <button type="button" onClick={() => window.location.href = 'main.html'} aria-label="Назад" className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-[#E4E6E8] bg-white text-[#111111] hover:bg-[#F2F6F9] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </button>
        <div>
            <h1 className="text-lg font-bold text-mainText tracking-tight flex items-center gap-1.5">
                Резерв FBO
            </h1>
            <p className="text-xs text-secondaryText">Режим руководителя</p>
        </div>
    </div>
    <div className="flex items-center gap-1.5">
        <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-purpleAccent/10 text-purpleAccent border border-purpleAccent/20">
            <span className="w-1.5 h-1.5 rounded-full bg-purpleAccent mr-1.5 animate-pulse"></span>
            Online
        </span>
    </div>
</header>

                    {/* Action Bar & Search */}
                    <div className="p-4 bg-coolGray border-b border-cardBorder space-y-3">
                        <div className="flex gap-2">
                            {/* 1. Кнопка "Добавить позицию" цвета #E23E9F */}
                            <button
                                onClick={() => setIsAddModalOpen(true)}
                                className="flex-1 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm hover:opacity-95 active:scale-[0.98] transition flex items-center justify-center gap-2 text-sm"
                                style={{ backgroundColor: '#E23E9F' }}
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"></path>
                                </svg>
                                Добавить позицию
                            </button>
                            
                            {/* 2. Если выбраны записи: обводка #E23E9F и черный цвет текста */}
                            <button
                                onClick={() => transferSelectedToFbo(selectedIds)}
                                disabled={selectedIds.length === 0}
                                className={`flex-1 font-medium py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm ${
                                    selectedIds.length > 0 
                                        ? 'bg-white border-2 text-mainText hover:bg-gray-50 active:scale-[0.98]' 
                                        : 'bg-cardBorder text-secondaryText cursor-not-allowed opacity-70 border border-transparent'
                                }`}
                                style={selectedIds.length > 0 ? { borderColor: '#E23E9F', color: '#111111' } : {}}
                            >
                                <svg className={`w-4 h-4 ${selectedIds.length > 0 ? 'text-pinkBtn' : 'text-secondaryText'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                                Передать в FBO ({selectedIds.length})
                            </button>
                        </div>

                        {/* Search & Select All */}
                        <div className="flex items-center gap-2">
                            <div className="relative flex-1">
                                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-secondaryText">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </span>
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Поиск по артикулу..."
                                    className="w-full pl-9 pr-4 py-2 bg-cardBg border border-cardBorder rounded-xl text-sm text-mainText placeholder-secondaryText focus:outline-none focus:ring-2 focus:ring-pinkBtn/50 focus:border-pinkBtn transition"
                                />
                                {searchQuery && (
                                    <button 
                                        onClick={() => setSearchQuery("")}
                                        className="absolute inset-y-0 right-0 pr-3 flex items-center text-secondaryText hover:text-mainText text-xs"
                                    >
                                        ✕
                                    </button>
                                )}
                            </div>

                            {filteredItems.length > 0 && (
                                <button
                                    onClick={toggleSelectAll}
                                    className="px-3 py-2 bg-cardBg border border-cardBorder rounded-xl text-xs font-medium text-mainText hover:bg-cardBorder/50 transition whitespace-nowrap"
                                >
                                    {selectedIds.length === filteredItems.length ? "Снять все" : "Выбрать все"}
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Positions List */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-2.5 pb-20">
                        {filteredItems.length === 0 ? (
                            <div className="text-center py-12 px-4 bg-cardBg rounded-2xl border border-cardBorder">
                                <div className="w-12 h-12 mx-auto mb-3 rounded-full bg-coolGray flex items-center justify-center text-secondaryText">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                                    </svg>
                                </div>
                                <h3 className="text-sm font-semibold text-mainText mb-1">Позиции не найдены</h3>
                                <p className="text-xs text-secondaryText">По вашему запросу ничего не найдено в резерве FBO.</p>
                            </div>
                        ) : (
                            filteredItems.map(item => {
                                const isSelected = selectedIds.includes(item.id);
                                return (
                                    <div 
                                        key={item.id}
                                        className={`bg-cardBg border rounded-2xl p-3.5 flex flex-col sm:flex-row items-start sm:items-center justify-between transition-all shadow-xs gap-3 ${
                                            isSelected ? 'border-pinkBtn ring-1 ring-pinkBtn/20 bg-pinkBtn/[0.02]' : 'border-cardBorder hover:border-secondaryText/50'
                                        }`}
                                    >
                                        <div className="flex items-center space-x-3 min-w-0 flex-1 w-full sm:w-auto">
                                            <input
                                                type="checkbox"
                                                checked={isSelected}
                                                onChange={() => toggleSelectOne(item.id)}
                                                className="w-4 h-4 text-pinkBtn border-cardBorder rounded focus:ring-pinkBtn cursor-pointer accent-pinkBtn shrink-0"
                                            />
                                            <div className="min-w-0 flex-1">
                                                <h4 className="text-sm font-bold text-mainText truncate" title={item.name}>
                                                    {item.name}
                                                </h4>
                                                <div className="flex items-center gap-2 mt-0.5">
                                                    <span className="text-xs text-secondaryText">Остаток:</span>
                                                    <span className="text-xs font-semibold px-2 py-0.5 rounded-md bg-coolGray text-mainText">
                                                        {item.quantity} шт.
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center space-x-1.5 w-full sm:w-auto justify-end">
                                            {/* Кнопка "Добавить" с серым фоном */}
                                            <button
                                                onClick={() => {
                                                    setAddMoreModalItem(item);
                                                    setAddMoreAmount(1);
                                                }}
                                                title="Добавить количество к этой позиции"
                                                className="px-2.5 py-1.5 bg-coolGray hover:bg-cardBorder text-mainText rounded-xl text-xs font-medium transition active:scale-95"
                                            >
                                                Добавить
                                            </button>

                                            {/* Кнопка "Вычесть" с серым фоном и без тире */}
                                            <button
                                                onClick={() => {
                                                    setSubtractModalItem(item);
                                                    setSubtractAmount(1);
                                                }}
                                                title="Вычесть количество"
                                                className="px-2.5 py-1.5 bg-coolGray hover:bg-cardBorder text-mainText rounded-xl text-xs font-medium transition active:scale-95"
                                            >
                                                Вычесть
                                            </button>

                                            {/* Кнопка "Стрелка вправо FBO" */}
                                            <button
                                                onClick={() => openTransferModal(item)}
                                                title="Передать в FBO"
                                                className="px-2.5 py-1.5 bg-pinkBtn/10 hover:bg-pinkBtn/20 text-pinkBtn border border-pinkBtn/20 rounded-xl text-xs font-medium transition flex items-center gap-1 active:scale-95"
                                            >
                                                → FBO
                                            </button>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="absolute bottom-4 left-4 right-4 z-50 bg-mainText text-white px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between text-xs animate-bounce">
                            <div className="flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-pinkBtn"></span>
                                <span className="font-medium">{toast}</span>
                            </div>
                        </div>
                    )}

                    {/* Modal: Добавить позицию в резерв (Создание новой) */}
                    {isAddModalOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-cardBorder animate-in fade-in slide-in-from-bottom duration-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-base font-bold text-mainText">Добавить позицию в резерв</h3>
                                    <button 
                                        onClick={() => setIsAddModalOpen(false)}
                                        className="w-8 h-8 rounded-full bg-coolGray flex items-center justify-center text-secondaryText hover:text-mainText text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <form onSubmit={handleAddPosition} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-secondaryText uppercase tracking-wider mb-1">
                                            Название / Артикул
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            value={newName}
                                            onChange={(e) => setNewName(e.target.value)}
                                            placeholder="например, R2GO_VF_AS_NEW"
                                            className="w-full px-3.5 py-2.5 bg-coolGray border border-cardBorder rounded-xl text-sm text-mainText focus:outline-none focus:ring-2 focus:ring-pinkBtn/50 focus:border-pinkBtn"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-secondaryText uppercase tracking-wider mb-1">
                                            Количество (шт.)
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            required
                                            value={newQuantity}
                                            onChange={(e) => setNewQuantity(e.target.value)}
                                            placeholder="100"
                                            className="w-full px-3.5 py-2.5 bg-coolGray border border-cardBorder rounded-xl text-sm text-mainText focus:outline-none focus:ring-2 focus:ring-pinkBtn/50 focus:border-pinkBtn"
                                        />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setIsAddModalOpen(false)}
                                            className="flex-1 bg-coolGray text-mainText font-medium py-2.5 rounded-xl text-sm hover:bg-cardBorder transition"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 text-white font-medium py-2.5 rounded-xl text-sm shadow-sm hover:opacity-95 transition"
                                            style={{ backgroundColor: '#E23E9F' }}
                                        >
                                            Добавить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Добавить количество к существующей позиции */}
                    {addMoreModalItem && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-cardBorder animate-in fade-in slide-in-from-bottom duration-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-base font-bold text-mainText">Добавить в резерв</h3>
                                    <button 
                                        onClick={() => setAddMoreModalItem(null)}
                                        className="w-8 h-8 rounded-full bg-coolGray flex items-center justify-center text-secondaryText hover:text-mainText text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <p className="text-xs text-secondaryText mb-4">
                                    Артикул: <span className="font-semibold text-mainText">{addMoreModalItem.name}</span> (Текущий остаток: {addMoreModalItem.quantity} шт.)
                                </p>

                                <form onSubmit={handleAddMoreSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-secondaryText uppercase tracking-wider mb-1">
                                            Количество для добавления
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            required
                                            value={addMoreAmount}
                                            onChange={(e) => setAddMoreAmount(e.target.value)}
                                            className="w-full px-3.5 py-2.5 bg-coolGray border border-cardBorder rounded-xl text-sm text-mainText focus:outline-none focus:ring-2 focus:ring-pinkBtn/50 focus:border-pinkBtn"
                                        />
                                    </div>

                                    {/* Quick presets */}
                                    <div className="flex gap-2">
                                        {[10, 50, 100, 500].map(val => (
                                            <button
                                                key={val}
                                                type="button"
                                                onClick={() => setAddMoreAmount(val)}
                                                className="flex-1 py-1.5 bg-coolGray hover:bg-cardBorder rounded-lg text-xs font-medium text-mainText transition"
                                            >
                                                +{val}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setAddMoreModalItem(null)}
                                            className="flex-1 bg-coolGray text-mainText font-medium py-2.5 rounded-xl text-sm hover:bg-cardBorder transition"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 text-white font-medium py-2.5 rounded-xl text-sm shadow-sm hover:opacity-95 transition"
                                            style={{ backgroundColor: '#E23E9F' }}
                                        >
                                            Добавить
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Вычесть из резерва */}
                    {subtractModalItem && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-cardBorder animate-in fade-in slide-in-from-bottom duration-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-base font-bold text-mainText">Вычесть из резерва</h3>
                                    <button 
                                        onClick={() => setSubtractModalItem(null)}
                                        className="w-8 h-8 rounded-full bg-coolGray flex items-center justify-center text-secondaryText hover:text-mainText text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <p className="text-xs text-secondaryText mb-4">
                                    Артикул: <span className="font-semibold text-mainText">{subtractModalItem.name}</span> (Доступно: {subtractModalItem.quantity} шт.)
                                </p>

                                <form onSubmit={handleSubtractSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-secondaryText uppercase tracking-wider mb-1">
                                            Количество для вычета
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            max={subtractModalItem.quantity}
                                            required
                                            value={subtractAmount}
                                            onChange={(e) => setSubtractAmount(e.target.value)}
                                            className="w-full px-3.5 py-2.5 bg-coolGray border border-cardBorder rounded-xl text-sm text-mainText focus:outline-none focus:ring-2 focus:ring-pinkBtn/50 focus:border-pinkBtn"
                                        />
                                    </div>

                                    {/* Quick presets */}
                                    <div className="flex gap-2">
                                        {[1, 5, 10, 50].map(val => (
                                            <button
                                                key={val}
                                                type="button"
                                                onClick={() => setSubtractAmount(val)}
                                                className="flex-1 py-1.5 bg-coolGray hover:bg-cardBorder rounded-lg text-xs font-medium text-mainText transition"
                                            >
                                                -{val}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setSubtractModalItem(null)}
                                            className="flex-1 bg-coolGray text-mainText font-medium py-2.5 rounded-xl text-sm hover:bg-cardBorder transition"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 text-white font-medium py-2.5 rounded-xl text-sm shadow-sm hover:opacity-95 transition"
                                            style={{ backgroundColor: '#E23E9F' }}
                                        >
                                            Вычесть
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Передать позицию в FBO с выбором количества */}
                    {transferModalItem && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-cardBorder animate-in fade-in slide-in-from-bottom duration-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-base font-bold text-mainText">Передать в FBO</h3>
                                    <button 
                                        onClick={() => setTransferModalItem(null)}
                                        className="w-8 h-8 rounded-full bg-coolGray flex items-center justify-center text-secondaryText hover:text-mainText text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <p className="text-xs text-secondaryText mb-4">
                                    Артикул: <span className="font-semibold text-mainText">{transferModalItem.name}</span> (Доступно в резерве: {transferModalItem.quantity} шт.)
                                </p>

                                <form onSubmit={handleSingleTransferSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-secondaryText uppercase tracking-wider mb-1">
                                            Количество для передачи в FBO
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            max={transferModalItem.quantity}
                                            required
                                            value={transferAmount}
                                            onChange={(e) => setTransferAmount(e.target.value)}
                                            className="w-full px-3.5 py-2.5 bg-coolGray border border-cardBorder rounded-xl text-sm text-mainText focus:outline-none focus:ring-2 focus:ring-pinkBtn/50 focus:border-pinkBtn"
                                        />
                                    </div>

                                    {/* Quick presets */}
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setTransferAmount(Math.min(10, transferModalItem.quantity))}
                                            className="flex-1 py-1.5 bg-coolGray hover:bg-cardBorder rounded-lg text-xs font-medium text-mainText transition"
                                        >
                                            10 шт.
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setTransferAmount(Math.min(50, transferModalItem.quantity))}
                                            className="flex-1 py-1.5 bg-coolGray hover:bg-cardBorder rounded-lg text-xs font-medium text-mainText transition"
                                        >
                                            50 шт.
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setTransferAmount(transferModalItem.quantity)}
                                            className="flex-1 py-1.5 bg-coolGray hover:bg-cardBorder rounded-lg text-xs font-medium text-mainText transition"
                                        >
                                            Всё ({transferModalItem.quantity})
                                        </button>
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setTransferModalItem(null)}
                                            className="flex-1 bg-coolGray text-mainText font-medium py-2.5 rounded-xl text-sm hover:bg-cardBorder transition"
                                        >
                                            Отмена
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 text-white font-medium py-2.5 rounded-xl text-sm shadow-sm hover:opacity-95 transition"
                                            style={{ backgroundColor: '#E23E9F' }}
                                        >
                                            Передать в FBO
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
