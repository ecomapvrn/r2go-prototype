                                            <button key={val} type="button" onClick={() => setAddQtyAmount(val)} className="flex-1 py-1.5 bg-coolGray hover:bg-cardBorder rounded-lg text-xs font-medium text-mainText transition cursor-pointer">+{val}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setAddQtyTask(null)} className="flex-1 bg-coolGray text-mainText font-medium py-2.5 rounded-xl text-sm hover:bg-cardBorder transition cursor-pointer">Отмена</button>
                                        <button type="submit" className="flex-1 text-white font-medium py-2.5 rounded-xl text-sm shadow-sm hover:opacity-95 transition cursor-pointer" style={{ backgroundColor: '#E23E9F' }}>Добавить</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Подробнее о времени по задаче */}
                    {detailTask && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cardBorder space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-bold text-mainText">Время по этапам сборки</h3>
                                    <button onClick={() => setDetailTask(null)} className="w-8 h-8 rounded-full bg-coolGray flex items-center justify-center text-secondaryText cursor-pointer">✕</button>
                                </div>
                                <p className="text-xs text-secondaryText">Позиция: <span className="font-semibold text-mainText">{detailTask.name}</span> ({detailTask.quantity} шт.)</p>
                                
                                <div className="space-y-2 text-xs">
                                    <div className="flex justify-between p-2.5 bg-coolGray rounded-xl">
                                        <span>Хвосты (обрезка пластика):</span>
                                        <span className="font-bold">{detailTask.stagesTime.tails}</span>
                                    </div>
                                    <div className="flex justify-between p-2.5 bg-coolGray rounded-xl">
                                        <span>Запайка (рукав + печь):</span>
                                        <span className="font-bold">{detailTask.stagesTime.sealing}</span>
                                    </div>
                                    <div className="flex justify-between p-2.5 bg-coolGray rounded-xl">
                                        <span>Обклейка ШК / стикеров:</span>
                                        <span className="font-bold">{detailTask.stagesTime.labeling}</span>
                                    </div>
                                    <div className="flex justify-between p-2.5 bg-pinkBtn/10 text-pinkBtn font-bold rounded-xl mt-2">
                                        <span>Общее расчетное время:</span>
                                        <span>{detailTask.stagesTime.total}</span>
                                    </div>
                                </div>

                                <button onClick={() => setDetailTask(null)} className="w-full py-2.5 bg-coolGray text-mainText rounded-xl text-xs font-semibold hover:bg-cardBorder transition cursor-pointer">Закрыть</button>
                            </div>
                        </div>
                    )}

                    {/* Toast */}
                    {toast && (
                        <div className="absolute bottom-6 left-4 right-4 z-50 bg-mainText text-white px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between text-xs animate-bounce">
                            <div className="flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-pinkBtn"></span>
                                <span className="font-medium">{toast}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
